name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: 检查分支结构与提交规范
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 打印当前分支与提交历史图
        run: |
          echo "分支列表："
          git branch -a
          echo ""
          echo "提交历史图："
          git log --oneline --graph --decorate --all | head -20

      - name: 校验工作区干净
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "工作区不干净，请检查未提交的改动"
            git status --porcelain
            exit 1
          fi
          echo "工作区干净，检查通过"
